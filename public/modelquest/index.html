<script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser is too old for the built-in decompressor. Please use an up-to-date Chrome, Edge, Firefox, or Safari.');const s=window.__mqParts.join('');const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').textContent=e.message;}})();</script></body></html>
